<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM lab ologramma</title>
<!-- Laboratorio dell'ologramma con la stessa catena dell'HUD (nucleo.js: composer con stencil, bloom con soglia 0,18)
     e i due modelli di demo.js, senza server: lo stato finto è fatto qui come lo farebbe ologramma.mjs.
     ?demo=turbofan|staffa  ?modo=…  ?suoni (suoni al primo clic). Tasti: 1–5 modi, E esploso, S sezione, A rotazione,
     R reset, T cambia modello, C calcolo finto della staffa, F foto, frecce e +/− camera. Da console: window.prova. -->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #050912; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #info { position: fixed; left: 12px; bottom: 8px; font: 10px ui-monospace, Menlo, monospace; color: #4f86b8; opacity: .7; pointer-events: none; z-index: 5; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>
<div id="holo"></div>
<div id="info"></div>
<script type="module">
import * as THREE from 'three';
import { createScene } from '/nucleo.js';
import { createOlogramma, angoloTesta, rischio } from '/ologramma/scena.js';
import { leggiFile } from '/ologramma/geometrie.js';
import { DEMO_TURBOFAN, DEMO_STAFFA } from '/ologramma/demo.js';
import { normalizzaModello, dentro, volume, ingombro } from '/ologramma/forme.js';
import { MATERIALI } from '/ologramma/materiali.js';

try {
  const q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
  const S = { mode: 'idle', audio: 0, mic: 0, split: 0, dock: 1, ...angoloTesta() }; // la testa nell'angolo, come con il report
  addEventListener('resize', () => Object.assign(S, angoloTesta()));
  const hud = await createScene($('gl'), S);

  // suoni: solo con ?suoni, e solo dopo un clic (l'AudioContext lo vuole)
  let sfx = null;
  if (q.has('suoni')) addEventListener('pointerdown', async () => {
    if (sfx) return;
    const ctx = new AudioContext(), { createSfx } = await import('/sfx.js');
    sfx = createSfx(ctx); sfx.out.connect(ctx.destination); suoni.sfx = sfx;
  }, { once: true });
  const suoni = { sfx: null }; // l'ologramma lo legge a ogni suono
  const sfxPonte = new Proxy({}, { get: (_, k) => (...a) => suoni.sfx?.[k]?.(...a) });

  // ---- stato finto, come lo darebbe GET /api/ologramma
  let numModello = 0, versione = 0, stato = null, ultimaFoto = null;
  const campi = new Map(), file = new Map();
  function statoDa(demo) {
    const r = normalizzaModello(JSON.parse(JSON.stringify(demo)));
    if (!r.modello) throw new Error(r.errori.slice(0, 3).join('; '));
    const m = r.modello;
    let kg = 0, conMassa = 0;
    for (const p of m.pezzi) { const v = volume(p), rho = MATERIALI[p.materiale].densita; if (v && rho) { kg += v * rho * 1e-9; conMassa++; } }
    return { aperto: true, modello: ++numModello, versione: ++versione, titolo: m.titolo, descrizione: m.descrizione, pezzi: m.pezzi, tolti: [],
      carichi: m.carichi, vincoli: m.vincoli, vista: m.vista, massa_kg: conMassa ? kg : null, ingombro_mm: null, analisi: null };
  }
  const pubblica = (cambia) => { stato = { ...stato, ...cambia, versione: ++versione }; holo.mostra(stato); return stato.versione; };

  // Campo finto per la staffa, plausibile ma non calcolato: flessione del braccio a sbalzo (M = F·(85 − x), W = 40·8²/6),
  // ridotta dove la nervatura irrigidisce, con un picco alla punta della nervatura; flangia quasi scarica.
  function campoFinto(pezzi) {
    const h = 2, F = 1500, W = (40 * 8 * 8) / 6, sy = 240;
    const b = { min: [Infinity, Infinity, Infinity], max: [-Infinity, -Infinity, -Infinity] };
    for (const p of pezzi) { const g = ingombro(p); for (let c = 0; c < 3; c++) { b.min[c] = Math.min(b.min[c], g.min[c]); b.max[c] = Math.max(b.max[c], g.max[c]); } }
    const n = [0, 1, 2].map((c) => Math.ceil((b.max[c] - b.min[c]) / h) + 2), origine = [0, 1, 2].map((c) => b.min[c] - h);
    const fs = new Float32Array(n[0] * n[1] * n[2]).fill(-1), perPezzo = new Map();
    let sMax = 0, fsMin = Infinity, punto = null;
    for (let k = 0; k < n[2]; k++) for (let j = 0; j < n[1]; j++) for (let i = 0; i < n[0]; i++) {
      const x = origine[0] + (i + 0.5) * h, y = origine[1] + (j + 0.5) * h, z = origine[2] + (k + 0.5) * h;
      const p = pezzi.find((pz) => dentro(pz, x, y, z));
      if (!p) continue;
      let s;
      if (p.id === 'braccio') {
        const rigido = x < 60 ? 0.25 + (0.75 * (x - 8)) / 52 : 1, M = F * Math.max(0, 85 - x);
        s = (M / W) * (Math.abs(y - 4) / 4) * rigido * (1 + 1.6 * Math.exp(-Math.hypot(x - 60, y - 8, Math.max(0, Math.abs(z) - 3)) / 6));
      } else if (p.id === 'nervatura') {
        const d = Math.abs(x + y - 68) / Math.SQRT2; // distanza dall'ipotenusa
        s = ((F * Math.max(0, 85 - x)) / W) * 0.55 * Math.max(0.1, 1 - d / 18);
      } else s = 25 * Math.max(0.15, 1 - y / 70) * (Math.abs(x - 4) / 4 + 0.3);
      s = Math.max(s, 0.5);
      const f = Math.min(1e6, sy / s);
      fs[i + n[0] * (j + n[1] * k)] = f;
      const pp = perPezzo.get(p.id) || { id: p.id, materiale: p.materiale, sforzo_max_MPa: 0, fs_min: Infinity, punto_mm: null };
      if (s > pp.sforzo_max_MPa) { pp.sforzo_max_MPa = s; pp.fs_min = f; pp.punto_mm = [x, y, z]; }
      perPezzo.set(p.id, pp);
      if (s > sMax) { sMax = s; fsMin = f; punto = [x, y, z]; }
    }
    const v = campi.size + 1;
    campi.set(String(v), fs);
    return {
      stato: 'fatta', versione: stato.versione, h_mm: h, voxel: fs.filter((x) => x > 0).length, iterazioni: 0, convergito: true, tempo_s: 0,
      sforzo_max_MPa: sMax, fs_min: fsMin, spostamento_max_mm: null, punto,
      pezzi: [...perPezzo.values()].sort((a, b) => a.fs_min - b.fs_min), avvisi: ['campo finto del laboratorio: non è un calcolo'],
      campo: { versione: v, nx: n[0], ny: n[1], nz: n[2], h, origine },
    };
  }

  // fetch finto per il campo e per i file; il resto va al server
  async function scarica(url) {
    const u = new URL(url, location.href);
    if (u.pathname === '/api/ologramma/campo') { const f = campi.get(u.searchParams.get('v')); return f ? new Response(f.slice().buffer) : new Response('', { status: 404 }); }
    const m = u.pathname.match(/^\/api\/ologramma\/file\/(\d+)\/([a-z0-9_-]+)$/);
    if (m) { const d = file.get(m[2]); return d ? new Response(d.slice(0)) : new Response('', { status: 404 }); }
    return fetch(url);
  }

  // strato passa per qui solo per le prove: il laboratorio tiene scena e camera dell'ologramma per misurare i pixel
  const lab = { scena: null, camera: null, letture: [] };
  const strato = (sc, cam) => { lab.scena = sc; lab.camera = cam; return hud.strato(sc, cam); };
  const holo = createOlogramma({
    renderer: hud.renderer, strato, contenitore: $('holo'), sfx: sfxPonte, scarica,
    onTogli: (id) => { if (stato && !stato.tolti.includes(id)) pubblica({ tolti: [...stato.tolti, id] }); },
    onFoto: (b64, v, m) => { const bin = atob(b64.slice(0, 64)); ultimaFoto = { v, m, byte: Math.floor((b64.length * 3) / 4) - (b64.endsWith('==') ? 2 : b64.endsWith('=') ? 1 : 0), w: (bin.charCodeAt(16) << 24 | bin.charCodeAt(17) << 16 | bin.charCodeAt(18) << 8 | bin.charCodeAt(19)), h: (bin.charCodeAt(20) << 24 | bin.charCodeAt(21) << 16 | bin.charCodeAt(22) << 8 | bin.charCodeAt(23)), b64 }; },
  });

  function apri(nome) { stato = statoDa(nome === 'staffa' ? DEMO_STAFFA : DEMO_TURBOFAN); holo.mostra(stato); }
  apri(q.get('demo') === 'staffa' ? 'staffa' : 'turbofan');
  if (q.get('modo')) holo.comando('modo', q.get('modo'));

  // ---- misure: intervalli fra fotogrammi, tempo di CPU del fotogramma, tempo di GPU con le query di tempo
  const gl = hud.renderer.getContext(), ext = gl.getExtension('EXT_disjoint_timer_query_webgl2');
  const misura = { attiva: false, intervalli: [], cpu: [], gpu: [], query: [] };
  function gpuInizio() { if (!misura.attiva || !ext) return null; const qq = gl.createQuery(); gl.beginQuery(ext.TIME_ELAPSED_EXT, qq); return qq; }
  function gpuFine(qq) { if (!qq) return; gl.endQuery(ext.TIME_ELAPSED_EXT); misura.query.push(qq); }
  function leggiQuery() {
    while (misura.query.length && gl.getQueryParameter(misura.query[0], gl.QUERY_RESULT_AVAILABLE)) {
      const qq = misura.query.shift();
      if (!gl.getParameter(ext.GPU_DISJOINT_EXT)) misura.gpu.push(gl.getQueryParameter(qq, gl.QUERY_RESULT) / 1e6);
      gl.deleteQuery(qq);
    }
  }
  const t0 = performance.now();
  let ultimo = t0, n = 0, fpsT = t0, fps = 0;
  function loop(ora) {
    requestAnimationFrame(loop);
    const dt = Math.min(0.05, (ora - ultimo) / 1000);
    if (misura.attiva) misura.intervalli.push(ora - ultimo);
    ultimo = ora;
    const inizio = performance.now(), t = 10 + (ora - t0) / 1000;
    holo.fotogramma(t, dt);
    const qq = gpuInizio();
    hud.frame(t, ((ora - t0) / 1000) % 3600, dt);
    gpuFine(qq);
    if (lab.letture.length) { // subito dopo il render, come la foto: il buffer si legge ancora
      hud.renderer.setRenderTarget(null);
      const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight, px = new Uint8Array(w * h * 4);
      gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (const ok of lab.letture.splice(0)) ok({ w, h, px });
    }
    holo.dopoRender();
    if (misura.attiva) misura.cpu.push(performance.now() - inizio);
    if (ext) leggiQuery();
    n++; if (ora - fpsT > 1000) { fps = (n * 1000) / (ora - fpsT); n = 0; fpsT = ora; }
    if (!q.has('pulito')) { const i = holo.info(); $('info').textContent = `${fps.toFixed(0)} fps · ${i.pezzi} pezzi · ${i.triangoli} triangoli · ${i.vista.modo} · esploso ${i.esploso.toFixed(2)}${i.vista.sezione ? ' · sezione ' + i.vista.sezione.asse : ''}`; }
  }
  requestAnimationFrame(loop);

  // ---- tastiera e mouse, come li girerebbe stem.js
  for (const tipo of ['pointerdown', 'pointermove', 'pointerup', 'pointercancel', 'dblclick']) $('gl').addEventListener(tipo, (e) => holo.puntatore(e));
  $('gl').addEventListener('wheel', (e) => holo.puntatore(e), { passive: false });
  const MODI = ['ologramma', 'solido', 'raggi-x', 'densita', 'sforzi'];
  addEventListener('keydown', (e) => {
    const i = holo.info(), k = e.key.toLowerCase();
    if (k >= '1' && k <= '5') holo.comando('modo', MODI[+k - 1]);
    else if (k === 'e') holo.comando('esploso', i.vista.esploso > 0.5 ? 0 : 1);
    else if (k === 's') { const s = i.vista.sezione, assi = [null, 'x', 'y', 'z'], a = assi[(assi.indexOf(s ? s.asse : null) + 1) % 4]; holo.comando('sezione', a ? { asse: a, posizione: centro(a), verso: 1 } : null); }
    else if (k === 'a') holo.comando('rotazione_auto', !i.vista.rotazione_auto);
    else if (k === 'r') holo.comando('reset');
    else if (k === 't') apri(stato.titolo.startsWith('Staffa') ? 'turbofan' : 'staffa');
    else if (k === 'c') prova.analizza();
    else if (k === 'f') pubblica({});
    else if (k === 'arrowleft' || k === 'arrowright') holo.comando('ruota', { dx: k === 'arrowleft' ? -0.04 : 0.04, dy: 0 });
    else if (k === 'arrowup' || k === 'arrowdown') holo.comando('ruota', { dx: 0, dy: k === 'arrowup' ? -0.04 : 0.04 });
    else if (k === '+' || k === '=') holo.comando('zoom', 1.15);
    else if (k === '-') holo.comando('zoom', 1 / 1.15);
    else if (k === 'escape') { stato = { ...stato, aperto: false }; holo.mostra(stato); }
  });
  // il centro del modello lungo un asse, per mettere il piano di taglio a metà
  function centro(a) {
    const c = { x: 0, y: 1, z: 2 }[a];
    let lo = Infinity, hi = -Infinity;
    for (const p of stato.pezzi) { const g = ingombro(p); if (g) { lo = Math.min(lo, g.min[c]); hi = Math.max(hi, g.max[c]); } }
    return Math.round(((lo + hi) / 2) * 100) / 100;
  }

  // ---- prove da console o da CDP
  const aspetta = (ms) => new Promise((r) => setTimeout(r, ms));
  const pct = (a, p) => { const s = [...a].sort((x, y) => x - y); return s.length ? +s[Math.min(s.length - 1, Math.floor(p * s.length))].toFixed(2) : null; };
  const prova = window.prova = {
    apri: (nome) => { apri(nome); return holo.info(); },
    modo: (m) => { holo.comando('modo', m); return holo.info().vista.modo; },
    esplodi: (v) => { holo.comando('esploso', v); return v; },
    sezione: (s) => { holo.comando('sezione', s && s.posizione === undefined ? { ...s, posizione: centro(s.asse) } : s); return holo.info().vista.sezione; },
    ruota: (dx, dy) => holo.comando('ruota', { dx, dy }),
    seleziona: (id) => { holo.comando('seleziona', id); return holo.info().vista.selezionato; },
    info: () => holo.info(),
    async attendi(ms = 6000) { const da = performance.now(); while (performance.now() - da < ms) { if (holo.info().fermo) return true; await aspetta(50); } return false; },
    // una versione nuova (nessun cambio) fa scattare la foto: torna la dimensione in byte e in pixel
    async foto(ms = 5000) {
      const v = pubblica({}); const da = performance.now();
      while (performance.now() - da < ms) { if (ultimaFoto && ultimaFoto.v === v) { const { b64, ...r } = ultimaFoto; return { ...r, dopo_ms: Math.round(performance.now() - da), inizio: b64.slice(0, 12) }; } await aspetta(30); }
      return null;
    },
    fotoBase64: () => ultimaFoto && ultimaFoto.b64,
    // I colori sullo schermo in alcuni punti del mondo (mm): media RGB 0..255 in una finestra di 5×5 pixel
    async colori(punti) {
      const A = await new Promise((ok) => lab.letture.push(ok)), v = new THREE.Vector3();
      return punti.map((p) => {
        v.set(...p).project(lab.camera);
        const cx = Math.round((v.x * 0.5 + 0.5) * A.w), cy = Math.round((v.y * 0.5 + 0.5) * A.h), rgb = [0, 0, 0];
        let n = 0;
        for (let y = cy - 2; y <= cy + 2; y++) for (let x = cx - 2; x <= cx + 2; x++) { const i = 4 * (x + A.w * y); for (let c = 0; c < 3; c++) rgb[c] += A.px[i + c]; n++; }
        return { punto: p, rgb: rgb.map((x) => Math.round(x / n)) };
      });
    },
    // Quello che la GPU tiene: chiudere l'ologramma deve riportare geometrie e texture a dove erano
    memoria: () => ({ geometrie: hud.renderer.info.memory.geometries, texture: hud.renderer.info.memory.textures, programmi: hud.renderer.info.programs.length }),
    // La camera dell'ologramma: numeri finiti o no (un NaN qui rompe raycast e piani di taglio)
    camera: () => { const k = lab.camera; return { pos: k.position.toArray(), near: k.near, far: k.far, vista: k.matrixWorldInverse.elements.every(Number.isFinite), proiezione: k.projectionMatrix.elements.every(Number.isFinite) }; },
    // Le etichette visibili e le coppie che si coprono (rettangoli del DOM)
    etichette() {
      const R = [...document.querySelectorAll('.holo-tag')].filter((e) => Number(e.style.opacity) > 0.05 && e.textContent)
        .map((e) => { const b = e.getBoundingClientRect(); return { testo: e.textContent, x0: b.left - 11, x1: b.right, y0: b.top, y1: b.bottom }; });
      let coppie = 0;
      for (let i = 0; i < R.length; i++) for (let j = i + 1; j < R.length; j++) if (R[i].x0 < R[j].x1 && R[j].x0 < R[i].x1 && R[i].y0 < R[j].y1 && R[j].y0 < R[i].y1) coppie++;
      return { visibili: R.map((r) => r.testo), coppie };
    },
    // Quanto il modello riempie la zona libera: il punto proiettato più lontano dal centro della zona, in px CSS
    riempimento() {
      const z = holo.info().zona, v = new THREE.Vector3();
      let r = 0, xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
      lab.scena.updateMatrixWorld(true);
      lab.scena.traverse((o) => {
        if (!o.isMesh || !o.userData.id || !o.parent.visible) return;
        const P = o.geometry.attributes.position;
        for (let i = 0; i < P.count; i += 3) {
          v.fromBufferAttribute(P, i).applyMatrix4(o.matrixWorld).project(lab.camera);
          const x = (v.x * 0.5 + 0.5) * innerWidth, y = (-v.y * 0.5 + 0.5) * innerHeight;
          r = Math.max(r, Math.hypot(x - z.cx, y - z.cy)); xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); ymin = Math.min(ymin, y); ymax = Math.max(ymax, y);
        }
      });
      return { zona: { cx: Math.round(z.cx), cy: Math.round(z.cy), r: Math.round(z.r) }, r_modello: Math.round(r), rapporto: +(r / z.r).toFixed(3),
        modello_px: [xmin, ymin, xmax, ymax].map(Math.round), centro_x_pct: +((100 * (xmin + xmax)) / 2 / innerWidth).toFixed(1), schermo: [innerWidth, innerHeight] };
    },
    // La sezione piena si vede davvero: spento il colore del tappo (colorWrite, solo qui), i pixel cambiano dentro
    // il materiale tagliato e restano uguali nell'aria. Punti della staffa nel piano z = 0, in mm.
    async tappo() {
      apri('staffa'); holo.comando('modo', 'ologramma'); holo.comando('sezione', { asse: 'z', posizione: 0, verso: 1 });
      await prova.attendi(8000); await aspetta(400);
      let tappo = null;
      lab.scena.traverse((o) => { if (o.isMesh && o.material.stencilFunc === THREE.NotEqualStencilFunc) tappo = o; });
      if (!tappo) return { errore: 'tappo non trovato' };
      const leggi = () => new Promise((ok) => lab.letture.push(ok));
      const A = await leggi();
      tappo.material.colorWrite = false; await aspetta(120);
      const B = await leggi();
      tappo.material.colorWrite = true;
      // nell'aria, in ordine di distanza dal materiale: 22,6, 29,7, 42 e 62 mm. Vicino al pezzo i pixel cambiano un
      // poco anche lì, per l'alone del bagliore delle righe del tappo, che cala con la distanza
      const punti = { dentro: [[4, 40, 0], [4, 70, 0], [50, 4, 0], [90, 4, 0], [20, 20, 0]], fuori: [[60, 40, 0], [40, 70, 0], [80, 50, 0], [95, 70, 0]] };
      const v = new THREE.Vector3(), L = 7, out = {};
      for (const [tipo, lista] of Object.entries(punti)) out[tipo] = lista.map((p) => {
        v.set(...p).project(lab.camera);
        const cx = Math.round((v.x * 0.5 + 0.5) * A.w), cy = Math.round((v.y * 0.5 + 0.5) * A.h);
        let s = 0, n = 0;
        for (let y = cy - L; y <= cy + L; y++) for (let x = cx - L; x <= cx + L; x++) {
          if (x < 0 || y < 0 || x >= A.w || y >= A.h) continue;
          const i = 4 * (x + A.w * y);
          for (let c = 0; c < 3; c++) { s += Math.abs(A.px[i + c] - B.px[i + c]); n++; }
        }
        return { punto: p, px: [cx, A.h - cy], scarto: n ? +(s / n).toFixed(2) : null };
      });
      return out;
    },
    analizza() { if (!stato.titolo.startsWith('Staffa')) return null; const a = campoFinto(stato.pezzi); pubblica({ analisi: a }); const { campo, pezzi, ...r } = a; return { ...r, campo: { nx: campo.nx, ny: campo.ny, nz: campo.nz }, pezzi: pezzi.map((p) => `${p.id} fs ${p.fs_min.toFixed(2)}`) }; },
    togli: (id) => pubblica({ tolti: [...stato.tolti, id] }),
    gesto: (g) => { holo.gesto(g); return holo.info().tolti; },
    async tempi(secondi = 4) {
      misura.intervalli = []; misura.cpu = []; misura.gpu = []; misura.attiva = true;
      await aspetta(secondi * 1000);
      misura.attiva = false; await aspetta(200); leggiQuery();
      const I = misura.intervalli.slice(2);
      return { fotogrammi: I.length, fps: +(1000 / (I.reduce((a, b) => a + b, 0) / I.length)).toFixed(1), intervallo_med_ms: pct(I, 0.5), intervallo_p90_ms: pct(I, 0.9), intervallo_max_ms: pct(I, 1),
        cpu_med_ms: pct(misura.cpu, 0.5), cpu_p90_ms: pct(misura.cpu, 0.9), gpu_med_ms: pct(misura.gpu, 0.5), gpu_p90_ms: pct(misura.gpu, 0.9), gpu_campioni: misura.gpu.length, query: !!ext };
    },
    chiudi: () => { stato = { ...stato, aperto: false }; holo.mostra(stato); },
    // i cinque caricatori, su file costruiti qui: un cubo di lato 2 unità con un angolo in (10, 10, 10)
    async file() {
      const V = [[10, 10, 10], [12, 10, 10], [12, 12, 10], [10, 12, 10], [10, 10, 12], [12, 10, 12], [12, 12, 12], [10, 12, 12]];
      const T = [[0, 2, 1], [0, 3, 2], [4, 5, 6], [4, 6, 7], [0, 1, 5], [0, 5, 4], [2, 3, 7], [2, 7, 6], [1, 2, 6], [1, 6, 5], [0, 4, 7], [0, 7, 3]];
      const testo = (s) => new TextEncoder().encode(s).buffer;
      const stl = testo('solid c\n' + T.map((t) => `facet normal 0 0 0\nouter loop\n${t.map((i) => `vertex ${V[i].join(' ')}`).join('\n')}\nendloop\nendfacet`).join('\n') + '\nendsolid c\n');
      const obj = testo(V.map((v) => `v ${v.join(' ')}`).join('\n') + '\n' + T.map((t) => `f ${t.map((i) => i + 1).join(' ')}`).join('\n') + '\n');
      const ply = testo(`ply\nformat ascii 1.0\nelement vertex 8\nproperty float x\nproperty float y\nproperty float z\nelement face 12\nproperty list uchar int vertex_indices\nend_header\n${V.map((v) => v.join(' ')).join('\n')}\n${T.map((t) => '3 ' + t.join(' ')).join('\n')}\n`);
      const glb = (() => { // un GLB a mano, in metri: 1 unità = 1 m, quindi il cubo è di 2 mm se le unità sono millimetri/1000
        const pos = new Float32Array(V.flat().map((x) => x / 1000)), idx = new Uint16Array(T.flat());
        const bin = new Uint8Array(96 + 72); bin.set(new Uint8Array(pos.buffer), 0); bin.set(new Uint8Array(idx.buffer), 96);
        const js = JSON.stringify({ asset: { version: '2.0' }, scene: 0, scenes: [{ nodes: [0] }], nodes: [{ mesh: 0 }], meshes: [{ primitives: [{ attributes: { POSITION: 0 }, indices: 1 }] }],
          buffers: [{ byteLength: bin.length }], bufferViews: [{ buffer: 0, byteOffset: 0, byteLength: 96 }, { buffer: 0, byteOffset: 96, byteLength: 72 }],
          accessors: [{ bufferView: 0, componentType: 5126, count: 8, type: 'VEC3', min: [0.01, 0.01, 0.01], max: [0.012, 0.012, 0.012] }, { bufferView: 1, componentType: 5123, count: 36, type: 'SCALAR' }] });
        const jb = new TextEncoder().encode(js + ' '.repeat((4 - (js.length % 4)) % 4)), tot = 12 + 8 + jb.length + 8 + bin.length;
        const out = new DataView(new ArrayBuffer(tot));
        out.setUint32(0, 0x46546c67, true); out.setUint32(4, 2, true); out.setUint32(8, tot, true);
        out.setUint32(12, jb.length, true); out.setUint32(16, 0x4e4f534a, true); new Uint8Array(out.buffer).set(jb, 20);
        out.setUint32(20 + jb.length, bin.length, true); out.setUint32(24 + jb.length, 0x004e4942, true); new Uint8Array(out.buffer).set(bin, 28 + jb.length);
        return out.buffer;
      })();
      const { zipSync, strToU8 } = await import('/three/examples/jsm/libs/fflate.module.js');
      const xml = `<?xml version="1.0" encoding="UTF-8"?><model unit="millimeter" xmlns="http://schemas.microsoft.com/3dmanufacturing/core/2015/02"><resources><object id="1" type="model"><mesh><vertices>${V.map(([x, y, z]) => `<vertex x="${x}" y="${y}" z="${z}"/>`).join('')}</vertices><triangles>${T.map(([a, b, c]) => `<triangle v1="${a}" v2="${b}" v3="${c}"/>`).join('')}</triangles></mesh></object></resources><build><item objectid="1"/></build></model>`;
      const tmf = zipSync({
        '[Content_Types].xml': strToU8('<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="model" ContentType="application/vnd.ms-package.3dmanufacturing-3dmodel+xml"/></Types>'),
        '_rels/.rels': strToU8('<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Target="/3D/3dmodel.model" Id="rel0" Type="http://schemas.microsoft.com/3dmanufacturing/2013/01/3dmodel"/></Relationships>'),
        '3D/3dmodel.model': strToU8(xml),
      }).buffer;
      // [estensione, dati, misure, ingombro atteso in mm]
      const casi = [['stl', stl, { scala: 5, centra: true }, [-5, 5]], ['obj', obj, { scala: 2, centra: false }, [20, 24]], ['ply', ply, { scala: 1, centra: true }, [-1, 1]],
        ['glb', glb, { scala: 1000, centra: true }, [-1, 1]], ['3mf', tmf, { scala: 1, centra: true }, [-1, 1]]];
      const out = [];
      for (const [est, dati, mis, [a, b]] of casi) {
        try {
          const r = await leggiFile(dati, est, mis), g = r.ingombro;
          const ok = [0, 1, 2].every((c) => Math.abs(g.min[c] - a) < 1e-4 && Math.abs(g.max[c] - b) < 1e-4) && Math.round(r.triangoli) === 12;
          out.push({ est, ok, triangoli: r.triangoli, min: g.min.map((x) => +x.toFixed(4)), max: g.max.map((x) => +x.toFixed(4)) });
          r.geometrie.forEach((x) => x.dispose());
        } catch (e) { out.push({ est, ok: false, errore: String(e && e.message || e) }); }
      }
      // e un pezzo 'file' dentro l'ologramma, dal suo indirizzo /api/ologramma/file/<modello>/<id>
      file.set('cubo', stl);
      stato = { ...statoDa({ titolo: 'File', pezzi: [{ id: 'cubo', forma: 'file', misure: { file: '/Users/tony/Modelli/cubo.stl', scala: 5 } }, { id: 'base', forma: 'scatola', misure: { x: 30, y: 2, z: 30 }, posizione: [0, -8, 0] }] }) };
      holo.mostra(stato);
      const da = performance.now();
      while (performance.now() - da < 4000 && holo.info().caricamenti === 0 && holo.info().triangoli < 24) await aspetta(30);
      while (performance.now() - da < 4000 && holo.info().caricamenti > 0) await aspetta(30);
      const i = holo.info();
      out.push({ est: 'scena', ok: i.errori.length === 0 && i.triangoli === 24, triangoli: i.triangoli, errori: i.errori });
      return out;
    },
    // i suoni nuovi, resi offline: niente NaN, picco sotto 1, e qualcosa si sente
    async suoni() {
      const { createSfx } = await import('/sfx.js'), out = {};
      for (const nome of ['esplodi', 'sezione', 'afferra', 'lancia', 'calcolo', 'report', 'ack']) {
        const ctx = new OfflineAudioContext(1, 48000 * 2, 48000), s = createSfx(ctx);
        s.out.connect(ctx.destination);
        if (nome === 'report') s.report({ hero: 0.9, lands: [1.34, 1.45] }, 0.05); else if (nome === 'esplodi') { s.esplodi(true, 0.05); s.esplodi(false, 1.0); } else s[nome](0.05);
        const d = (await ctx.startRendering()).getChannelData(0);
        let picco = 0, e = 0, nan = 0, ultimo = 0;
        for (const x of d) { if (!Number.isFinite(x)) nan++; else { picco = Math.max(picco, Math.abs(x)); e += x * x; } }
        for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > 0.01 * picco) ultimo = i; // fine: sotto −40 dB dal picco
        out[nome] = { picco: +picco.toFixed(4), rms: +Math.sqrt(e / d.length).toFixed(5), nan, durata_s: +((ultimo / 48000) - 0.05).toFixed(2) };
      }
      return out;
    },
  };
  window.__pronto = true;
} catch (e) { window.__errore = String(e && e.stack || e); console.error(e); }
</script>
