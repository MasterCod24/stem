<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nexus · laboratorio suoni</title>
<style>
  :root { --bg: #070b17; --bg2: #0b1226; --ink: #cfe8ff; --dim: #6f8fb3; --az: #2fa8ff; --or: #ff8a1e; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg) 70%); color: var(--ink);
         font: 14px/1.5 ui-monospace, "SF Mono", Menlo, monospace; padding: 32px 16px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 15px; letter-spacing: .25em; color: var(--az); text-shadow: 0 0 12px #2fa8ff88; margin: 0 0 4px; font-weight: 600; }
  p { color: var(--dim); margin: 0 0 24px; }
  .row { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; padding: 12px 0; border-top: 1px solid #2fa8ff22; }
  .row b { color: var(--ink); font-weight: 500; letter-spacing: .08em; }
  .row span { color: var(--dim); font-size: 12px; }
  button { background: #2fa8ff14; color: var(--az); border: 1px solid #2fa8ff66; border-radius: 4px; padding: 7px 12px;
           font: inherit; font-size: 12px; letter-spacing: .12em; cursor: pointer; }
  button:hover { background: #2fa8ff2a; box-shadow: 0 0 12px #2fa8ff44; }
  button.on { color: var(--or); border-color: #ff8a1e99; background: #ff8a1e18; }
  .btns { display: flex; gap: 6px; }
  canvas { width: 100%; height: 70px; display: block; margin-top: 20px; border: 1px solid #2fa8ff22; border-radius: 4px; }
  #log { color: var(--dim); font-size: 12px; margin-top: 10px; min-height: 1.5em; white-space: pre-wrap; }
  a { color: var(--az); }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr auto; } .row span { grid-column: 1 / -1; grid-row: 2; } }
</style>
</head>
<body>
<main>
  <h1>NEXUS · SUONI</h1>
  <p>Ogni suono è sintetizzato al volo (public/sfx.js). «Ascolta» lo suona; «WAV» lo rende offline e lo scarica.</p>
  <div id="list"></div>
  <canvas id="wave" width="1520" height="140"></canvas>
  <div id="log"></div>
</main>
<script type="module">
import { createSfx } from './sfx.js';

// scene: istanti (dopo t) allineati ai segmenti del video di riferimento
const SCENES = {
  boot:   { label: 'FORMAZIONE', note: 'tappeto che sale, stop netto, ting', dur: 5.4, run: (s, t) => s.boot(t) },
  reveal: { label: 'RIVELAZIONE', note: 'ronzio ~207 Hz + sonar (come da 5.4 s)', dur: 3.6, run: (s, t) => { s.reveal(t + 0.18); s.listen(t + 0.94); } },
  listen: { label: 'ASCOLTO', note: 'pochi impulsi sonar, poi silenzio', dur: 5.0, run: (s, t) => s.listen(t + 0.1) },
  ack:    { label: 'CONFERMA', note: 'blip a due toni (come da 22.6 s)', dur: 1.0, run: (s, t) => s.ack(t + 0.27) },
  think:  { label: 'ELABORA', note: 'letto quasi impercettibile (acceso 4 s)', dur: 6.0, run: (s, t) => { s.think(true, t + 0.2); s.think(false, t + 4.2); } },
  chat:   { label: 'DIALOGO', note: 'ascolto → conferma, due volte (la seconda più discreta)', dur: 9, run: (s, t) => { s.listen(t + 0.1); s.ack(t + 1.6); s.think(true, t + 1.9); s.think(false, t + 3.5); s.listen(t + 5); s.ack(t + 6.4); } },
  report: { label: 'REPORT', note: 'salita, tappeto, colpo del protagonista, blip delle schede (come da 34,4 s)', dur: 2.8,
            run: (s, t) => s.report({ hero: 0.9, lands: Array.from({ length: 9 }, (_, i) => 1.34 + i * 0.09) }, t) },
  seq:    { label: 'SEQUENZA', note: 'formazione → rivelazione → ascolto → conferma', dur: 13, run: (s, t) => { s.boot(t); s.reveal(t + 5.58); s.listen(t + 6.34); s.ack(t + 11.5); } },
};

let live = null;
function liveSfx() {
  if (!live) { const ctx = new AudioContext(); const sfx = createSfx(ctx); sfx.out.connect(ctx.destination); live = { ctx, sfx }; }
  if (live.ctx.state !== 'running') live.ctx.resume();
  return live;
}
function play(name) {
  const { ctx, sfx } = liveSfx();
  SCENES[name].run(sfx, ctx.currentTime + 0.05);
}

// rendering offline → { wav (base64), peak, rms }
async function renderScene(name, sr = 44100) {
  const sc = SCENES[name];
  const ctx = new OfflineAudioContext(2, Math.round(sc.dur * sr), sr);
  const sfx = createSfx(ctx); sfx.out.connect(ctx.destination);
  sc.run(sfx, 0);
  const buf = await ctx.startRendering();
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let peak = 0, sum = 0;
  for (let i = 0; i < L.length; i++) { const m = Math.max(Math.abs(L[i]), Math.abs(R[i])); if (m > peak) peak = m; sum += L[i] * L[i]; }
  drawWave(L);
  return { wav: toBase64(encodeWav([L, R], sr)), peakDb: 20 * Math.log10(peak), rmsDb: 10 * Math.log10(sum / L.length), name, buf };
}
window.renderScene = async n => { const r = await renderScene(n); delete r.buf; return r; };

function encodeWav(chs, sr) {
  const n = chs[0].length, nc = chs.length, b = new DataView(new ArrayBuffer(44 + n * nc * 2));
  const str = (o, s) => [...s].forEach((c, i) => b.setUint8(o + i, c.charCodeAt(0)));
  str(0, 'RIFF'); b.setUint32(4, 36 + n * nc * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  b.setUint32(16, 16, true); b.setUint16(20, 1, true); b.setUint16(22, nc, true); b.setUint32(24, sr, true);
  b.setUint32(28, sr * nc * 2, true); b.setUint16(32, nc * 2, true); b.setUint16(34, 16, true); str(36, 'data'); b.setUint32(40, n * nc * 2, true);
  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < nc; c++, o += 2) b.setInt16(o, Math.max(-1, Math.min(1, chs[c][i])) * 32767, true);
  return new Uint8Array(b.buffer);
}
function toBase64(u8) { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000)); return btoa(s); }

function drawWave(d) {
  const c = document.getElementById('wave'), g = c.getContext('2d'), w = c.width, h = c.height;
  g.clearRect(0, 0, w, h); g.fillStyle = '#2fa8ff';
  const step = d.length / w;
  for (let x = 0; x < w; x++) {
    let m = 0; for (let i = Math.floor(x * step); i < (x + 1) * step; i++) m = Math.max(m, Math.abs(d[i] || 0));
    const y = m * h / 2; g.fillRect(x, h / 2 - y, 1, Math.max(1, 2 * y));
  }
}

const log = s => { document.getElementById('log').textContent = s; };
const list = document.getElementById('list');
for (const [name, sc] of Object.entries(SCENES)) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<b>${sc.label}</b><span>${sc.note}</span><div class="btns"></div>`;
  const btns = row.querySelector('.btns');
  if (name === 'think') {
    const b = document.createElement('button'); b.textContent = 'ACCENDI';
    b.onclick = () => { const { sfx } = liveSfx(); const on = !b.classList.contains('on'); b.classList.toggle('on', on); b.textContent = on ? 'SPEGNI' : 'ACCENDI'; sfx.think(on); };
    btns.append(b);
  } else {
    const b = document.createElement('button'); b.textContent = 'ASCOLTA'; b.onclick = () => play(name); btns.append(b);
  }
  const r = document.createElement('button'); r.textContent = 'WAV';
  r.onclick = async () => {
    const res = await renderScene(name);
    const url = URL.createObjectURL(new Blob([Uint8Array.from(atob(res.wav), c => c.charCodeAt(0))], { type: 'audio/wav' }));
    const a = document.createElement('a'); a.href = url; a.download = `nexus-${name}.wav`; a.click();
    log(`${name}: picco ${res.peakDb.toFixed(1)} dBFS, rms ${res.rmsDb.toFixed(1)} dBFS`);
  };
  btns.append(r);
  list.append(row);
}
const q = new URLSearchParams(location.search).get('render');
if (q && SCENES[q]) renderScene(q).then(r => log(`${q}: picco ${r.peakDb.toFixed(1)} dBFS, rms ${r.rmsDb.toFixed(1)} dBFS`));
</script>
</body>
</html>
