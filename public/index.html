<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM</title>
<link rel="icon" href="/icona.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070b17;
    --neon: #2fa8ff;
    --neon-soft: rgba(47, 168, 255, .35);
    --ink: rgba(196, 226, 255, .9);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); user-select: none; cursor: default;
    font-family: "Share Tech Mono", ui-monospace, Menlo, monospace; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Scritta di stato accanto alla testa, come nel video */
  #status { position: fixed; left: 0; top: 0; font-size: 12px; letter-spacing: .16em; color: var(--neon); white-space: pre;
    text-shadow: 0 0 6px rgba(47, 168, 255, .9), 0 0 14px rgba(47, 168, 255, .45); pointer-events: none; will-change: transform; }
  #small { position: fixed; left: 0; top: 0; font-size: 10px; letter-spacing: .2em; color: var(--neon); opacity: 0;
    text-shadow: 0 0 6px rgba(47, 168, 255, .7); transition: opacity .4s; pointer-events: none; white-space: nowrap; }
  #small.on { opacity: .85; }

  /* GIF ed esempi: cornice olografica */
  #media { position: fixed; left: 0; top: 0; width: 300px; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #media.on { opacity: 1; }
  #media .frame { position: relative; border: 1px solid var(--neon-soft); border-radius: 3px; overflow: hidden; background: rgba(4, 10, 24, .6);
    box-shadow: 0 0 30px rgba(47, 168, 255, .18), inset 0 0 24px rgba(47, 168, 255, .1);
    clip-path: inset(0 0 100% 0); transition: clip-path .7s cubic-bezier(.7, 0, .2, 1); }
  #media.on .frame { clip-path: inset(0 0 0 0); }
  #media img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: contain; }
  #media .frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120, 200, 255, .05) 0 1px, transparent 1px 3px); }
  #media .title { margin-top: 7px; font-size: 10px; letter-spacing: .2em; color: var(--neon); text-shadow: 0 0 6px rgba(47, 168, 255, .7); }

  /* Il browser dentro l'HUD: solo per i compiti complessi */
  #screen { position: fixed; right: 3.5vw; top: 50%; width: 55vw; transform: translate(3vw, -50%); opacity: 0;
    transition: opacity .7s ease, transform .9s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  body.browsing #screen { opacity: 1; transform: translate(0, -50%); }
  #screen .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 11px; letter-spacing: .2em; color: var(--neon);
    text-shadow: 0 0 6px rgba(47, 168, 255, .7); }
  #screen .live { width: 6px; height: 6px; border-radius: 50%; background: var(--neon); box-shadow: 0 0 10px var(--neon); animation: live 1.6s ease-in-out infinite; }
  @keyframes live { 50% { opacity: .25; } }
  #screen .frame { position: relative; aspect-ratio: 1280 / 760; border-radius: 4px; overflow: hidden; background: #02060b;
    border: 1px solid var(--neon-soft); box-shadow: 0 0 60px rgba(47, 168, 255, .12), inset 0 0 40px rgba(47, 168, 255, .06);
    clip-path: inset(0 100% 0 0); transition: clip-path 1.1s cubic-bezier(.7, 0, .2, 1) .15s; }
  body.browsing #screen .frame { clip-path: inset(0 0 0 0); }
  #screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #screen .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120, 200, 255, .035) 0 1px, transparent 1px 3px); }
  #screen .c { position: absolute; width: 18px; height: 18px; border: 0 solid var(--neon); filter: drop-shadow(0 0 4px var(--neon)); }
  #screen .tl { left: -1px; top: -1px; border-top-width: 2px; border-left-width: 2px; }
  #screen .tr { right: -1px; top: -1px; border-top-width: 2px; border-right-width: 2px; }
  #screen .bl { left: -1px; bottom: -1px; border-bottom-width: 2px; border-left-width: 2px; }
  #screen .br { right: -1px; bottom: -1px; border-bottom-width: 2px; border-right-width: 2px; }

  /* Report a schermo intero (report.js): schede scure con bordo al neon, come nel video di ROSE */
  #report { position: fixed; inset: 0; display: none; pointer-events: none; }
  #report.on { display: block; }
  #report .top { position: absolute; left: 2.2vw; right: 2.2vw; top: 2.2vh; display: flex; justify-content: space-between;
    font-size: 11px; letter-spacing: .2em; color: var(--neon); text-shadow: 0 0 6px rgba(47, 168, 255, .7); }
  #report .grid { position: absolute; left: 2.2vw; right: 2.2vw; top: 6vh; bottom: 2.6vh; display: grid; gap: 12px;
    grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr));
    perspective: 1500px; perspective-origin: 55% 35%; }
  #report .dock { visibility: hidden; }
  #report .card { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    padding: 9px 11px; border-radius: 3px; background: rgba(3, 8, 18, .9); color: #eef6ff;
    border: 1px solid rgba(96, 190, 255, .6); box-shadow: 0 0 16px rgba(47, 168, 255, .2), inset 0 0 18px rgba(47, 168, 255, .07); }
  #report .card.landed { animation: rp-land .8s ease-out; }
  @keyframes rp-land { from { border-color: #d2ecff; box-shadow: 0 0 44px rgba(110, 200, 255, .75), inset 0 0 30px rgba(110, 200, 255, .3); } }
  #report .ghost { pointer-events: none; }
  #report header, #report footer { display: flex; justify-content: space-between; gap: 10px; flex: none;
    font-size: 8.5px; letter-spacing: .14em; color: rgba(150, 205, 255, .8); text-transform: uppercase; white-space: nowrap; }
  #report header .k, #report footer span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #report footer { margin-top: auto; padding-top: 6px; }
  #report h3 { flex: none; margin: 7px 0 6px; font: 800 clamp(13px, 1.2vw, 20px)/1.04 "Avenir Next Condensed", "Share Tech Mono", sans-serif;
    text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(160, 215, 255, .35); }
  #report p { min-height: 0; overflow: hidden; font-size: clamp(10px, .78vw, 12.5px); line-height: 1.35; color: rgba(228, 240, 255, .88); }
  #report p.note { flex: none; max-height: 2.8em; margin-top: 5px; font-size: clamp(9px, .66vw, 11px); color: rgba(200, 225, 255, .7); }
  #report .num { flex: none; margin: 2px 0 6px; font: 800 clamp(30px, 3.3vw, 56px)/1 "Avenir Next Condensed", sans-serif; color: #fff;
    text-shadow: 0 0 18px rgba(150, 210, 255, .55); }
  #report .bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 7%; padding: 14px 6px 0;
    border-bottom: 1px solid rgba(96, 190, 255, .55);
    background: repeating-linear-gradient(0deg, rgba(96, 190, 255, .13) 0 1px, transparent 1px 25%); }
  #report .bars i { position: relative; flex: 1; background: #f3f9ff; box-shadow: 0 0 8px rgba(200, 230, 255, .45); }
  #report .bars b { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -3px); font-size: 8.5px; font-weight: normal;
    color: rgba(200, 225, 255, .8); white-space: nowrap; }
  #report .labels { flex: none; display: flex; gap: 7%; padding: 3px 6px 0; font-size: 8px; letter-spacing: .06em; color: rgba(170, 210, 255, .75); }
  #report .labels span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  #report .frame { position: relative; flex: 1; min-height: 0; margin: 6px -4px 0; overflow: hidden; background: #000;
    border: 1px solid rgba(96, 190, 255, .25); }
  #report .frame img, #report .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #report .frame.broken img { display: none; }
  #report iframe { opacity: 0; transition: opacity .6s ease; }
  #report iframe.on { opacity: 1; }
  #report .spin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%;
    border: 1.5px solid rgba(235, 245, 255, .85); animation: rp-spin 1.4s ease-in-out infinite; }
  @keyframes rp-spin { 50% { opacity: .3; transform: scale(.8); } }
  #report .dots { display: flex; gap: 4px; align-items: center; }
  #report .dots i { width: 4px; height: 4px; background: rgba(150, 205, 255, .45); }
  #report .dots i.on { width: 16px; background: var(--neon); box-shadow: 0 0 6px var(--neon); }

  /* Ologramma: etichette, scheda, legenda e cursore li fa scena.js qui dentro, col suo stile. #holo fa da contesto di
     impilamento: lo z-index di scena.js resta qui, e scritte, avvisi e report, che vengono dopo, restano sopra */
  #holo { position: fixed; inset: 0; pointer-events: none; }
  body.olo #gl { cursor: grab; }
  body.olo #gl:active { cursor: grabbing; }
  #holo .holo-card::before { content: ""; position: absolute; inset: -1px; pointer-events: none; /* angoli a staffa, come il browser */
    background: linear-gradient(var(--neon) 0 0) left top / 14px 2px, linear-gradient(var(--neon) 0 0) left top / 2px 14px,
      linear-gradient(var(--neon) 0 0) right top / 14px 2px, linear-gradient(var(--neon) 0 0) right top / 2px 14px,
      linear-gradient(var(--neon) 0 0) left bottom / 14px 2px, linear-gradient(var(--neon) 0 0) left bottom / 2px 14px,
      linear-gradient(var(--neon) 0 0) right bottom / 14px 2px, linear-gradient(var(--neon) 0 0) right bottom / 2px 14px;
    background-repeat: no-repeat; filter: drop-shadow(0 0 4px var(--neon)); }
  /* Le dita viste dalla fotocamera: punto pieno l'indice, anello il pollice. Il cursore dei gesti lo spegne scena.js.
     Lo z-index vale solo dentro #holo: le dita restano sopra scheda e legenda di scena.js (z-index 4), non sopra il resto */
  #dita { position: absolute; inset: 0; z-index: 5; }
  #dita i { position: absolute; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: #9ff0ff;
    box-shadow: 0 0 8px rgba(47, 168, 255, .9); opacity: 0; transition: opacity .2s; will-change: transform; }
  #dita i.pollice { background: none; border: 1.5px solid #9ff0ff; }
  #dita i.on { opacity: .85; }

  #warn { position: fixed; left: 50%; bottom: 6vh; transform: translateX(-50%); display: none; font-size: 11px; letter-spacing: .2em;
    color: var(--neon); text-shadow: 0 0 6px rgba(47, 168, 255, .7); text-transform: uppercase; }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body data-mode="idle">
  <canvas id="gl"></canvas>
  <div id="holo"><div id="dita"><i class="pollice"></i><i></i><i class="pollice"></i><i></i></div></div>
  <div id="status"></div>
  <div id="small"></div>

  <div id="media">
    <div class="frame"><img id="media-img" alt=""></div>
    <div class="title" id="media-title"></div>
  </div>

  <div id="screen">
    <div class="head"><span class="live"></span><span id="p-what">BROWSER</span><span id="p-host"></span></div>
    <div class="frame">
      <img src="/api/screen" alt="">
      <div class="scan"></div>
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
    </div>
  </div>

  <div id="warn"></div>

  <script type="module" src="/stem.js"></script>
</body>
</html>
