<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>O.S.C.A.R.</title>
<link rel="icon" href="/icona.png">
<style>
  /* Nero, ciano dominante, arancione e rosso solo per le anomalie (S.allarme), caratteri di sistema sottili. Niente font da
     fuori: l'HUD non chiede niente a nessun sito per disegnarsi.
     Il moto (27/11): ogni transizione usa la molla di fisica.js, campionata in --molla (le cose con una massa, un filo di
     rimbalzo) e --lieve (opacità e colori, senza rimbalzo). Durate e curve non si scelgono qui: le calcola lui. I valori
     di riserva sotto servono solo finché oscar.js non ha scritto quelli veri. */
  :root {
    --nero: #000;
    --ciano: #3ee6ff;
    --ciano-vivo: #b6f8ff;
    --ciano-tenue: rgba(62, 230, 255, .32);
    --ciano-velo: rgba(62, 230, 255, .07);
    --acqua: #3dffd0;                       /* il luogo e l'ora attuale nella meteo, e l'esito «per O.S.C.A.R.» */
    --testo: rgba(222, 251, 255, .94);
    --testo-2: rgba(150, 222, 238, .7);
    --arancio: #ff9b33;                     /* solo attenzione: ascolto spento, calcolo fallito */
    --rosso: #ff4343;                       /* solo critico: server o cervello persi, un pezzo che cede */
    --bagliore: 0 0 6px rgba(62, 230, 255, .6), 0 0 14px rgba(62, 230, 255, .22);
    --sottile: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: Menlo, Monaco, monospace;
    --molla: ease-out; --t-molla: 300ms; --lieve: ease-out; --t-lieve: 220ms;
    --neon: var(--ciano); --neon-soft: var(--ciano-tenue); --ink: var(--testo); --bg: var(--nero);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--nero); color: var(--testo); user-select: none; cursor: default;
    font-family: var(--sottile); font-weight: 300; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Angoli a staffa: il bordo dei moduli, al posto delle cornici piene. Un pixel, senza ombre: le ombre su ogni scheda
     costavano a ogni fotogramma delle entrate */
  .staffe { position: relative; }
  .staffe::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; --s: var(--staffa, var(--ciano)); /* sopra le immagini */
    background: linear-gradient(var(--s) 0 0) left top / 10px 1px, linear-gradient(var(--s) 0 0) left top / 1px 10px,
      linear-gradient(var(--s) 0 0) right top / 10px 1px, linear-gradient(var(--s) 0 0) right top / 1px 10px,
      linear-gradient(var(--s) 0 0) left bottom / 10px 1px, linear-gradient(var(--s) 0 0) left bottom / 1px 10px,
      linear-gradient(var(--s) 0 0) right bottom / 10px 1px, linear-gradient(var(--s) 0 0) right bottom / 1px 10px;
    background-repeat: no-repeat; opacity: .85; }

  /* ---------- Attorno al nucleo: scritta di stato e dati a raggiera. oscar.js li porta con le molle: seguono l'anello con un
     filo di ritardo, e i fili si tendono ---------- */
  #fili { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; transition: opacity var(--t-lieve) var(--lieve); }
  #fili polyline { fill: none; stroke: var(--ciano); stroke-width: 1; opacity: .5; transition: opacity var(--t-lieve) var(--lieve); }
  #fili circle { fill: var(--ciano); opacity: .9; transition: opacity var(--t-lieve) var(--lieve); }
  #fili .spento { opacity: 0; }
  #status, #small, .raggio, #anomalia { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; will-change: transform; }
  #status { font: 300 12px/1 var(--sottile); letter-spacing: .26em; color: var(--ciano-vivo); text-shadow: var(--bagliore); }
  #small { font: 400 9.5px/1 var(--mono); letter-spacing: .16em; color: var(--ciano); opacity: 0; transition: opacity var(--t-lieve) var(--lieve); text-shadow: var(--bagliore); }
  #small.on { opacity: .9; }
  .raggio { transition: opacity var(--t-lieve) var(--lieve); contain: layout style; }
  .raggio b { display: block; font: 400 8.5px/1 var(--mono); letter-spacing: .22em; color: var(--testo-2); }
  .raggio span { display: block; margin-top: 5px; font: 200 15px/1 var(--sottile); letter-spacing: .12em; color: var(--testo); text-shadow: var(--bagliore); }
  .raggio.destra { text-align: left; } .raggio.sinistra { text-align: right; }
  .spento { opacity: 0 !important; }
  #anomalia { font: 400 10.5px/1 var(--mono); letter-spacing: .2em; color: var(--arancio); opacity: 0; transition: opacity var(--t-lieve) var(--lieve);
    text-shadow: 0 0 8px currentColor; }
  #anomalia.on { opacity: 1; }
  #anomalia.critico { color: var(--rosso); animation: allerta .55s ease-in-out infinite alternate; }
  #anomalia::before { content: "▲ "; }
  @keyframes allerta { to { opacity: .45; } }

  /* ---------- Ai bordi: ora e memoria in alto, gli eventi a destra. Numeri veri; ogni evento si spegne col suo tempo di
     dimezzamento (oscar.js), così la luce dice quanto è vecchio ---------- */
  .bordo { position: fixed; pointer-events: none; font: 400 8.5px/1.45 var(--mono); letter-spacing: .14em; color: var(--testo-2);
    transition: opacity var(--t-lieve) var(--lieve); contain: strict; }
  #cima { left: 1.6vw; right: 1.6vw; top: 1.5vh; height: 14px; display: flex; justify-content: space-between; gap: 2vw; opacity: .75; }
  #cima b { font-weight: 400; color: var(--ciano); text-shadow: var(--bagliore); }
  #colonna-dx { right: 1.6vw; top: 7vh; bottom: 7vh; width: 31.5em; overflow: hidden; opacity: .6; text-align: right; } /* 42 caratteri: l'evento più lungo con l'ora intera */
  #eventi { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; white-space: pre; }
  #eventi div { transition: opacity var(--t-lieve) var(--lieve), transform var(--t-molla) var(--molla); }
  @starting-style { #eventi div { opacity: 0; transform: translateX(14px); } }
  /* Spenti col report, la meteo e l'ologramma (hanno le loro barre), e col browser la colonna che finirebbe sulla pagina.
     !important: le opacità sopra sono per ID e vincerebbero */
  body.olo .bordo, body.report .bordo, body.meteo .bordo, body.olo #fili, body.report #fili, body.meteo #fili, body.olo .raggio, body.report .raggio, body.meteo .raggio,
  body.browsing #colonna-dx, body.browsing .raggio { opacity: 0 !important; }
  /* All'avvio si vede solo la goccia che si forma: dati, fili e bordi arrivano quando gli anelli ci sono (ready) */
  body:not(.ready) .bordo, body:not(.ready) #fili, body:not(.ready) .raggio { opacity: 0 !important; }

  /* ---------- La scheda dell'ascolto: quello che Tony dice, mentre lo dice. Sotto, una riga sola che è il livello del
     microfono, con la balistica di un VU ---------- */
  #ascolto { position: fixed; left: 0; bottom: 6.5vh; width: min(54vw, 800px); padding: 10px 18px 12px; pointer-events: none;
    background: linear-gradient(90deg, rgba(62, 230, 255, .09), rgba(62, 230, 255, .03) 55%, rgba(62, 230, 255, 0));
    opacity: .4; transition: opacity var(--t-lieve) var(--lieve); will-change: transform; }
  #ascolto.on { opacity: 1; }
  #ascolto header { display: flex; justify-content: space-between; gap: 12px; font: 400 8.5px/1 var(--mono); letter-spacing: .22em; color: var(--testo-2); }
  #esito { color: var(--testo-2); transition: color var(--t-lieve) var(--lieve); }
  #esito.per { color: var(--acqua); text-shadow: 0 0 6px rgba(61, 255, 208, .6); }
  #frase { margin-top: 9px; min-height: 1.25em; font: 200 clamp(17px, 1.75vw, 27px)/1.25 var(--sottile); letter-spacing: .07em;
    text-transform: uppercase; color: #fff; text-shadow: var(--bagliore); overflow-wrap: anywhere; }
  #frase-viva { color: var(--ciano-vivo); opacity: .72; }
  #cursore { display: inline-block; width: .45em; height: .82em; margin-left: .18em; vertical-align: -0.04em; background: var(--ciano);
    box-shadow: 0 0 8px var(--ciano); opacity: 0; }
  #ascolto.vivo #cursore { opacity: 1; animation: cursore 1s steps(1) infinite; }
  @keyframes cursore { 50% { opacity: 0; } }
  #livello { position: relative; height: 1px; margin-top: 10px; background: var(--ciano-velo); }
  #livello i { position: absolute; inset: 0; background: var(--ciano); box-shadow: 0 0 6px var(--ciano); transform-origin: 0 50%; transform: scaleX(0); }
  body.browsing #ascolto { width: min(30vw, 440px); }
  /* Col report, l'ologramma o la meteo: una riga sola nella fascia in basso, sotto le schede, e solo quando c'è una frase */
  body.olo #ascolto, body.report #ascolto, body.meteo #ascolto { bottom: 2px; width: min(70vw, 1000px); padding: 3px 0 4px; background: none; opacity: 0; }
  body.olo #ascolto.on, body.report #ascolto.on, body.meteo #ascolto.on { opacity: 1; }
  body.olo #ascolto header, body.report #ascolto header, body.meteo #ascolto header, body.olo #livello, body.report #livello, body.meteo #livello,
  body.olo #ascolto::before, body.report #ascolto::before, body.meteo #ascolto::before { display: none; }
  body.olo #frase, body.report #frase, body.meteo #frase { margin: 0; min-height: 0; font-size: 12px; line-height: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* GIF ed esempi: modulo con gli angoli a staffa, che si apre come una porta su una molla */
  #media { position: fixed; left: 0; top: 0; width: 300px; opacity: 0; transition: opacity var(--t-lieve) var(--lieve); pointer-events: none; }
  #media.on { opacity: 1; }
  #media .frame { position: relative; overflow: hidden; background: rgba(0, 14, 20, .45);
    clip-path: inset(0 0 100% 0); transition: clip-path var(--t-molla) var(--molla); }
  #media.on .frame { clip-path: inset(0 0 0 0); }
  #media img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: contain; }
  #media .title { margin-top: 8px; font: 400 9px/1 var(--mono); letter-spacing: .2em; color: var(--ciano); text-shadow: var(--bagliore); }

  /* Il browser dentro l'HUD: solo per i compiti complessi */
  #screen { position: fixed; right: 3.5vw; top: 50%; width: 55vw; transform: translate(3vw, -50%); opacity: 0;
    transition: opacity var(--t-lieve) var(--lieve), transform var(--t-molla) var(--molla); pointer-events: none; }
  body.browsing #screen { opacity: 1; transform: translate(0, -50%); }
  #screen .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font: 400 9.5px/1 var(--mono); letter-spacing: .22em; color: var(--ciano);
    text-shadow: var(--bagliore); }
  #screen .live { width: 6px; height: 6px; border-radius: 50%; background: var(--ciano); box-shadow: 0 0 10px var(--ciano); animation: live 1.6s ease-in-out infinite; }
  @keyframes live { 50% { opacity: .25; } }
  #screen .frame { position: relative; aspect-ratio: 1280 / 760; overflow: hidden; background: #01070a;
    box-shadow: 0 0 60px rgba(62, 230, 255, .1); outline: 1px solid rgba(62, 230, 255, .14);
    clip-path: inset(0 100% 0 0); transition: clip-path var(--t-molla) var(--molla); }
  body.browsing #screen .frame { clip-path: inset(0 0 0 0); }
  #screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #screen .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120, 240, 255, .035) 0 1px, transparent 1px 3px); }

  /* Report a schermo intero (report.js): moduli trasparenti con gli angoli a staffa. Le schede entrano su molle, in ordine
     di distanza dal protagonista, come un fronte d'onda */
  #report { position: fixed; inset: 0; display: none; pointer-events: none; }
  #report.on { display: block; }
  #report .top { position: absolute; left: 2.2vw; right: 2.2vw; top: 2.2vh; display: flex; justify-content: space-between;
    font: 400 10px/1 var(--mono); letter-spacing: .22em; color: var(--ciano); text-shadow: var(--bagliore); }
  #report .grid { position: absolute; left: 2.2vw; right: 2.2vw; top: 6vh; bottom: 2.6vh; display: grid; gap: 12px;
    grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); }
  #report .dock { visibility: hidden; }
  #report .card { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    padding: 10px 12px; color: var(--testo);
    background: linear-gradient(160deg, rgba(62, 230, 255, .075), rgba(0, 18, 26, .5) 40%, rgba(0, 10, 16, .55));
    box-shadow: inset 0 1px 0 rgba(62, 230, 255, .3); }
  #report .card::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; --s: var(--ciano);
    background: linear-gradient(var(--s) 0 0) left top / 10px 1px, linear-gradient(var(--s) 0 0) left top / 1px 10px,
      linear-gradient(var(--s) 0 0) right top / 10px 1px, linear-gradient(var(--s) 0 0) right top / 1px 10px,
      linear-gradient(var(--s) 0 0) left bottom / 10px 1px, linear-gradient(var(--s) 0 0) left bottom / 1px 10px,
      linear-gradient(var(--s) 0 0) right bottom / 10px 1px, linear-gradient(var(--s) 0 0) right bottom / 1px 10px;
    background-repeat: no-repeat; opacity: .85; }
  #report header, #report footer { display: flex; justify-content: space-between; gap: 10px; flex: none;
    font: 400 8px/1.2 var(--mono); letter-spacing: .16em; color: var(--testo-2); text-transform: uppercase; white-space: nowrap; }
  #report header .k, #report footer span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #report footer { margin-top: auto; padding-top: 6px; }
  #report h3 { flex: none; margin: 8px 0 7px; font: 300 clamp(13px, 1.2vw, 20px)/1.1 var(--sottile); letter-spacing: .06em;
    text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(160, 240, 255, .35); }
  #report p { min-height: 0; overflow: hidden; font-size: clamp(10px, .78vw, 12.5px); font-weight: 300; line-height: 1.4; color: rgba(225, 248, 255, .86); }
  #report p.note { flex: none; max-height: 2.8em; margin-top: 5px; font-size: clamp(9px, .66vw, 11px); color: var(--testo-2); }
  #report .num { flex: none; margin: 2px 0 6px; font: 100 clamp(32px, 3.6vw, 60px)/1 var(--sottile); letter-spacing: .02em; color: #fff;
    text-shadow: 0 0 18px rgba(150, 240, 255, .55); }
  #report .bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 7%; padding: 14px 6px 0;
    border-bottom: 1px solid var(--ciano-tenue);
    background: repeating-linear-gradient(0deg, rgba(62, 230, 255, .1) 0 1px, transparent 1px 25%); }
  #report .bars i { position: relative; flex: 1; transform-origin: 50% 100%; background: linear-gradient(rgba(182, 248, 255, .95), rgba(62, 230, 255, .55)); box-shadow: 0 0 8px rgba(62, 230, 255, .45); }
  #report .bars b { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -3px); font: 400 8px/1 var(--mono);
    color: var(--testo-2); white-space: nowrap; }
  #report .labels { flex: none; display: flex; gap: 7%; padding: 4px 6px 0; font: 400 7.5px/1.2 var(--mono); letter-spacing: .08em; color: var(--testo-2); }
  #report .labels span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  #report .frame { position: relative; flex: 1; min-height: 0; margin: 6px -4px 0; overflow: hidden; background: #000;
    outline: 1px solid rgba(62, 230, 255, .18); }
  #report .frame img, #report .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #report .frame.broken img { display: none; }
  #report iframe { opacity: 0; transition: opacity var(--t-lieve) var(--lieve); }
  #report iframe.on { opacity: 1; }
  #report .spin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%;
    border: 1.5px solid var(--ciano-vivo); animation: rp-spin 1.4s ease-in-out infinite; }
  @keyframes rp-spin { 50% { opacity: .3; transform: scale(.8); } }
  #report .dots { display: flex; gap: 4px; align-items: center; }
  #report .dots i { width: 4px; height: 4px; background: var(--ciano-tenue); transition: width var(--t-molla) var(--molla); }
  #report .dots i.on { width: 16px; background: var(--ciano); box-shadow: 0 0 6px var(--ciano); }

  /* #holo: la vista meteo ci mette etichette e scritte, e fa da contesto di impilamento (avvisi e report restano sopra).
     L'ologramma dal 22/11 sta in Blender: qui non c'è più */
  #holo { position: fixed; inset: 0; pointer-events: none; }
  /* Le dita viste dalla fotocamera: punto pieno l'indice, anello il pollice */
  #dita { position: absolute; inset: 0; z-index: 5; }
  #dita i { position: absolute; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--ciano-vivo);
    box-shadow: 0 0 8px rgba(62, 230, 255, .9); opacity: 0; transition: opacity var(--t-lieve) var(--lieve); will-change: transform; }
  #dita i.pollice { background: none; border: 1.5px solid var(--ciano-vivo); }
  #dita i.on { opacity: .85; }
  #dita.riposo i.on { opacity: .35; } /* a riposo le mani si vedono ma non comandano: gesti.js aspetta un palmo aperto */

  /* Avvisi: ciano le notizie, arancione e rosso solo le anomalie */
  #promemoria { position: fixed; z-index: 8; top: 10vh; left: 50%; transform: translateX(-50%);
    width: min(32rem, 90vw); max-height: 38vh; overflow: auto; padding: 14px 18px;
    color: var(--testo); background: #071419; border: 1px solid var(--ciano-tenue); font-size: 15px; line-height: 1.45; overflow-wrap: anywhere;
    transition: opacity var(--t-lieve) var(--lieve), transform var(--t-molla) var(--molla); }
  @starting-style { #promemoria { opacity: 0; transform: translate(-50%, -12px); } }
  #promemoria header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px;
    color: var(--ciano); font: 12px var(--mono); }
  #promemoria button { background: transparent; border: 1px solid var(--ciano-tenue); padding: 4px 8px; color: var(--testo); cursor: pointer; }
  #promemoria p { margin-top: 4px; }
  #warn { position: fixed; left: 50%; top: 6.5vh; transform: translate(-50%, -10px); padding: 7px 14px; font: 400 10px/1 var(--mono);
    letter-spacing: .22em; color: var(--ciano); text-shadow: var(--bagliore); text-transform: uppercase; white-space: nowrap; opacity: 0; pointer-events: none;
    background: linear-gradient(90deg, transparent, rgba(62, 230, 255, .08), transparent);
    transition: opacity var(--t-lieve) var(--lieve), transform var(--t-molla) var(--molla); }
  #warn.on { opacity: 1; transform: translate(-50%, 0); }
  #warn.attenzione { color: var(--arancio); text-shadow: 0 0 8px rgba(255, 155, 51, .7); background: linear-gradient(90deg, transparent, rgba(255, 155, 51, .1), transparent); }
  #warn.critico { color: var(--rosso); text-shadow: 0 0 8px rgba(255, 67, 67, .7); background: linear-gradient(90deg, transparent, rgba(255, 67, 67, .1), transparent); }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body data-mode="idle">
  <canvas id="gl"></canvas>
  <div id="holo"><div id="dita"><i class="pollice"></i><i></i><i class="pollice"></i><i></i></div></div>

  <svg id="fili" aria-hidden="true"></svg>
  <div id="status"></div>
  <div id="small"></div>
  <div id="anomalia"></div>
  <div class="raggio destra" id="d-voce"><b>VOICE</b><span></span></div>
  <div class="raggio destra" id="d-latenza"><b>RESPONSE</b><span></span></div>
  <div class="raggio sinistra" id="d-ascolto"><b>AUDIO INPUT</b><span></span></div>
  <div class="raggio sinistra" id="d-sistemi"><b>SYSTEMS</b><span></span></div>
  <div class="raggio sinistra" id="d-grafica"><b>RENDER</b><span></span></div>

  <div class="bordo" id="cima"><span><b>O.S.C.A.R.</b> // NEURAL CORE</span><span id="cima-ora"></span><span id="cima-dati"></span></div>
  <div class="bordo" id="colonna-dx"><div id="eventi"></div></div>

  <section id="ascolto" class="staffe">
    <header><span>VOICE INPUT // IT-IT</span><span id="esito"></span></header>
    <p id="frase"><span id="frase-fissa"></span><span id="frase-viva"></span><i id="cursore"></i></p>
    <div id="livello"><i></i></div>
  </section>

  <div id="media">
    <div class="frame staffe"><img id="media-img" alt=""></div>
    <div class="title" id="media-title"></div>
  </div>

  <div id="screen">
    <div class="head"><span class="live"></span><span id="p-what">BROWSER</span><span id="p-host"></span></div>
    <div class="frame staffe">
      <img src="/api/screen" alt="">
      <div class="scan"></div>
    </div>
  </div>

  <aside id="promemoria" aria-label="Promemoria" hidden>
    <header>Promemoria<button type="button">Chiudi</button></header>
    <div role="status"><strong></strong><p></p></div>
  </aside>
  <div id="warn"></div>

  <script type="module" src="/oscar.js"></script>
</body>
</html>
