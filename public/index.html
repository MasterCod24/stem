<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STEM</title>
<link rel="icon" href="/icona.png">
<style>
  /* Stile JARVIS: nero, ciano dominante, arancione e rosso solo per le anomalie (S.allarme), caratteri di sistema
     sottili. Niente font da fuori: l'HUD non chiede niente a nessun sito per disegnarsi. */
  :root {
    --nero: #000;
    --ciano: #3ee6ff;
    --ciano-vivo: #b6f8ff;
    --ciano-tenue: rgba(62, 230, 255, .32);
    --ciano-velo: rgba(62, 230, 255, .07);
    --acqua: #3dffd0;                       /* accento verde acqua, come il bordo della sfera nel riferimento */
    --testo: rgba(222, 251, 255, .94);
    --testo-2: rgba(150, 222, 238, .7);
    --arancio: #ff9b33;                     /* solo attenzione: ascolto spento, calcolo fallito */
    --rosso: #ff4343;                       /* solo critico: server o cervello persi, un pezzo che cede */
    --bagliore: 0 0 6px rgba(62, 230, 255, .7), 0 0 16px rgba(62, 230, 255, .28);
    --sottile: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: Menlo, Monaco, monospace;
    --neon: var(--ciano); --neon-soft: var(--ciano-tenue); --ink: var(--testo); --bg: var(--nero);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--nero); color: var(--testo); user-select: none; cursor: default;
    font-family: var(--sottile); font-weight: 300; -webkit-font-smoothing: antialiased; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

  /* Angoli a staffa: il bordo dei moduli fluttuanti, al posto delle cornici piene */
  .staffe { position: relative; }
  .staffe::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; --s: var(--staffa, var(--ciano)); /* sopra le immagini */
    background: linear-gradient(var(--s) 0 0) left top / 13px 1.5px, linear-gradient(var(--s) 0 0) left top / 1.5px 13px,
      linear-gradient(var(--s) 0 0) right top / 13px 1.5px, linear-gradient(var(--s) 0 0) right top / 1.5px 13px,
      linear-gradient(var(--s) 0 0) left bottom / 13px 1.5px, linear-gradient(var(--s) 0 0) left bottom / 1.5px 13px,
      linear-gradient(var(--s) 0 0) right bottom / 13px 1.5px, linear-gradient(var(--s) 0 0) right bottom / 1.5px 13px;
    background-repeat: no-repeat; filter: drop-shadow(0 0 3px var(--s)); }

  /* ---------- Attorno al nucleo: scritta di stato e dati a raggiera (stem.js li mette sugli anelli) ---------- */
  #fili { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; transition: opacity .5s; }
  #fili polyline { fill: none; stroke: var(--ciano); stroke-width: 1; opacity: .55; filter: drop-shadow(0 0 2px var(--ciano)); }
  #fili circle { fill: var(--ciano); opacity: .9; }
  #fili .spento { opacity: 0; }
  #status, #small, .dato, #anomalia { position: fixed; left: 0; top: 0; pointer-events: none; white-space: nowrap; will-change: transform; }
  #status { font: 300 12px/1 var(--sottile); letter-spacing: .26em; color: var(--ciano-vivo); text-shadow: var(--bagliore); }
  #small { font: 400 9.5px/1 var(--mono); letter-spacing: .16em; color: var(--ciano); opacity: 0; transition: opacity .4s; text-shadow: var(--bagliore); }
  #small.on { opacity: .9; }
  .dato { transition: opacity .5s; contain: layout style; }
  .dato b { display: block; font: 400 8.5px/1 var(--mono); letter-spacing: .22em; color: var(--testo-2); }
  .dato span { display: block; margin-top: 5px; font: 200 15px/1 var(--sottile); letter-spacing: .12em; color: var(--testo); text-shadow: var(--bagliore); }
  .dato.destra { text-align: left; } .dato.sinistra { text-align: right; }
  .spento { opacity: 0 !important; }
  #anomalia { font: 400 10.5px/1 var(--mono); letter-spacing: .2em; color: var(--arancio); opacity: 0; transition: opacity .3s;
    text-shadow: 0 0 8px currentColor; }
  #anomalia.on { opacity: 1; }
  #anomalia.critico { color: var(--rosso); animation: allerta 1.1s steps(2) infinite; }
  #anomalia::before { content: "▲ "; }
  @keyframes allerta { 50% { opacity: .45; } }

  /* ---------- Micro-dati ai bordi: numeri veri (orario, memoria, spettro del microfono, eventi), non decorazione finta ---------- */
  .bordo { position: fixed; pointer-events: none; font: 400 8.5px/1.45 var(--mono); letter-spacing: .14em; color: var(--testo-2);
    transition: opacity .6s; contain: strict; }
  #cima { left: 1.6vw; right: 1.6vw; top: 1.5vh; height: 14px; display: flex; justify-content: space-between; gap: 2vw; opacity: .75; }
  #cima b { font-weight: 400; color: var(--ciano); text-shadow: var(--bagliore); }
  #colonna-sx, #colonna-dx { top: 7vh; bottom: 7vh; width: 13.5em; white-space: pre; overflow: hidden; opacity: .42;
    mask-image: linear-gradient(transparent, #000 14%, #000 86%, transparent); }
  #colonna-sx { left: 1.6vw; }
  #colonna-dx { right: 1.6vw; text-align: right; width: 31.5em; } /* 42 caratteri: l'evento più lungo con l'ora intera */
  #colonna-sx pre, #colonna-dx pre { position: absolute; left: 0; right: 0; bottom: 0; font: inherit; }
  #fondo { left: 1.6vw; right: 1.6vw; bottom: 1.4vh; height: 12px; display: flex; justify-content: space-between; align-items: center; gap: 14px; opacity: .7; }
  #fondo .linea { position: relative; flex: 1; height: 1px; background: var(--ciano-tenue); overflow: hidden; }
  #fondo .linea::after { content: ""; position: absolute; top: -1px; left: 0; width: 14%; height: 3px; background: linear-gradient(90deg, transparent, var(--ciano), transparent);
    animation: spazza 5.5s linear infinite; }
  @keyframes spazza { from { transform: translateX(-100%); } to { transform: translateX(720%); } }
  /* Spenti col report e l'ologramma (hanno le loro barre), e col browser le colonne che finirebbero sotto nucleo e pagina.
     !important: le opacità sopra sono per ID e vincerebbero */
  body.olo .bordo, body.report .bordo, body.olo #fili, body.report #fili, body.olo .dato, body.report .dato,
  body.browsing #colonna-sx, body.browsing #colonna-dx, body.browsing .dato { opacity: 0 !important; }
  /* All'avvio si vede solo la sfera che si forma con ASSEMBLING: dati, fili e bordi arrivano quando gli anelli ci sono (ready) */
  body:not(.ready) .bordo, body:not(.ready) #fili, body:not(.ready) .dato { opacity: 0 !important; }

  /* ---------- La scheda dell'ascolto: quello che Tony dice, mentre lo dice ---------- */
  #ascolto { position: fixed; left: 0; bottom: 6.5vh; width: min(54vw, 800px); padding: 10px 18px 10px; pointer-events: none;
    background: linear-gradient(90deg, rgba(62, 230, 255, .11), rgba(62, 230, 255, .04) 55%, rgba(62, 230, 255, 0));
    opacity: .4; transition: opacity .35s; will-change: transform; }
  #ascolto.on { opacity: 1; }
  #ascolto header { display: flex; justify-content: space-between; gap: 12px; font: 400 8.5px/1 var(--mono); letter-spacing: .22em; color: var(--testo-2); }
  #esito { color: var(--testo-2); }
  #esito.per { color: var(--acqua); text-shadow: 0 0 6px rgba(61, 255, 208, .6); }
  #frase { margin-top: 9px; min-height: 1.25em; font: 200 clamp(17px, 1.75vw, 27px)/1.25 var(--sottile); letter-spacing: .07em;
    text-transform: uppercase; color: #fff; text-shadow: var(--bagliore); overflow-wrap: anywhere; }
  #frase-viva { color: var(--ciano-vivo); opacity: .72; }
  #cursore { display: inline-block; width: .45em; height: .82em; margin-left: .18em; vertical-align: -0.04em; background: var(--ciano);
    box-shadow: 0 0 8px var(--ciano); opacity: 0; }
  #ascolto.vivo #cursore { opacity: 1; animation: cursore 1s steps(1) infinite; }
  @keyframes cursore { 50% { opacity: 0; } }
  #livello { display: flex; gap: 5px; height: 9px; margin-top: 10px; align-items: flex-end; }
  #livello i { flex: 1; height: 100%; background: var(--ciano); opacity: .75; transform-origin: 50% 100%; transform: scaleY(.12); box-shadow: 0 0 4px var(--ciano); }
  body.browsing #ascolto { width: min(30vw, 440px); }
  /* Col report o l'ologramma: una riga sola nella fascia in basso, sotto le schede, e solo quando c'è una frase */
  body.olo #ascolto, body.report #ascolto { bottom: 2px; width: min(70vw, 1000px); padding: 3px 0 4px; background: none; opacity: 0; }
  body.olo #ascolto.on, body.report #ascolto.on { opacity: 1; }
  body.olo #ascolto header, body.report #ascolto header, body.olo #livello, body.report #livello, body.olo #ascolto::before, body.report #ascolto::before { display: none; }
  body.olo #frase, body.report #frase { margin: 0; min-height: 0; font-size: 12px; line-height: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* GIF ed esempi: modulo fluttuante con gli angoli a staffa */
  #media { position: fixed; left: 0; top: 0; width: 300px; opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #media.on { opacity: 1; }
  #media .frame { position: relative; overflow: hidden; background: rgba(0, 14, 20, .45);
    clip-path: inset(0 0 100% 0); transition: clip-path .7s cubic-bezier(.7, 0, .2, 1); }
  #media.on .frame { clip-path: inset(0 0 0 0); }
  #media img { display: block; width: 100%; height: auto; max-height: 240px; object-fit: contain; }
  #media .frame::after { content: ""; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120, 240, 255, .05) 0 1px, transparent 1px 3px); }
  #media .title { margin-top: 8px; font: 400 9px/1 var(--mono); letter-spacing: .2em; color: var(--ciano); text-shadow: var(--bagliore); }

  /* Il browser dentro l'HUD: solo per i compiti complessi */
  #screen { position: fixed; right: 3.5vw; top: 50%; width: 55vw; transform: translate(3vw, -50%); opacity: 0;
    transition: opacity .7s ease, transform .9s cubic-bezier(.2, .8, .2, 1); pointer-events: none; }
  body.browsing #screen { opacity: 1; transform: translate(0, -50%); }
  #screen .head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font: 400 9.5px/1 var(--mono); letter-spacing: .22em; color: var(--ciano);
    text-shadow: var(--bagliore); }
  #screen .live { width: 6px; height: 6px; border-radius: 50%; background: var(--ciano); box-shadow: 0 0 10px var(--ciano); animation: live 1.6s ease-in-out infinite; }
  @keyframes live { 50% { opacity: .25; } }
  #screen .frame { position: relative; aspect-ratio: 1280 / 760; overflow: hidden; background: #01070a;
    box-shadow: 0 0 60px rgba(62, 230, 255, .1); outline: 1px solid rgba(62, 230, 255, .14);
    clip-path: inset(0 100% 0 0); transition: clip-path 1.1s cubic-bezier(.7, 0, .2, 1) .15s; }
  body.browsing #screen .frame { clip-path: inset(0 0 0 0); }
  #screen img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #screen .scan { position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(120, 240, 255, .035) 0 1px, transparent 1px 3px); }

  /* Report a schermo intero (report.js): moduli trasparenti con gli angoli a staffa, come nel video di ROSE ma senza cornici piene */
  #report { position: fixed; inset: 0; display: none; pointer-events: none; }
  #report.on { display: block; }
  #report .top { position: absolute; left: 2.2vw; right: 2.2vw; top: 2.2vh; display: flex; justify-content: space-between;
    font: 400 10px/1 var(--mono); letter-spacing: .22em; color: var(--ciano); text-shadow: var(--bagliore); }
  #report .grid { position: absolute; left: 2.2vw; right: 2.2vw; top: 6vh; bottom: 2.6vh; display: grid; gap: 12px;
    grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr));
    perspective: 1500px; perspective-origin: 55% 35%; }
  #report .dock { visibility: hidden; }
  #report .card { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden;
    padding: 10px 12px; color: var(--testo);
    background: linear-gradient(160deg, rgba(62, 230, 255, .085), rgba(0, 18, 26, .5) 40%, rgba(0, 10, 16, .55));
    box-shadow: inset 0 1px 0 rgba(62, 230, 255, .35), inset 0 0 22px rgba(62, 230, 255, .05); }
  #report .card::before { content: ""; position: absolute; inset: 0; z-index: 2; pointer-events: none; --s: var(--ciano);
    background: linear-gradient(var(--s) 0 0) left top / 13px 1.5px, linear-gradient(var(--s) 0 0) left top / 1.5px 13px,
      linear-gradient(var(--s) 0 0) right top / 13px 1.5px, linear-gradient(var(--s) 0 0) right top / 1.5px 13px,
      linear-gradient(var(--s) 0 0) left bottom / 13px 1.5px, linear-gradient(var(--s) 0 0) left bottom / 1.5px 13px,
      linear-gradient(var(--s) 0 0) right bottom / 13px 1.5px, linear-gradient(var(--s) 0 0) right bottom / 1.5px 13px;
    background-repeat: no-repeat; filter: drop-shadow(0 0 3px var(--s)); }
  #report .card.landed { animation: rp-land .8s ease-out; }
  @keyframes rp-land { from { box-shadow: inset 0 1px 0 #d2fbff, 0 0 40px rgba(110, 235, 255, .55), inset 0 0 30px rgba(110, 235, 255, .25); } }
  #report .ghost { pointer-events: none; }
  #report header, #report footer { display: flex; justify-content: space-between; gap: 10px; flex: none;
    font: 400 8px/1.2 var(--mono); letter-spacing: .16em; color: var(--testo-2); text-transform: uppercase; white-space: nowrap; }
  #report header .k, #report footer span:first-child { overflow: hidden; text-overflow: ellipsis; }
  #report footer { margin-top: auto; padding-top: 6px; }
  #report h3 { flex: none; margin: 8px 0 7px; font: 300 clamp(13px, 1.2vw, 20px)/1.1 var(--sottile); letter-spacing: .06em;
    text-transform: uppercase; color: #fff; text-shadow: 0 0 10px rgba(160, 240, 255, .35); }
  #report p { min-height: 0; overflow: hidden; font-size: clamp(10px, .78vw, 12.5px); font-weight: 300; line-height: 1.4; color: rgba(225, 248, 255, .86); }
  #report p.note { flex: none; max-height: 2.8em; margin-top: 5px; font-size: clamp(9px, .66vw, 11px); color: var(--testo-2); }
  #report .num { flex: none; margin: 2px 0 6px; font: 100 clamp(32px, 3.6vw, 60px)/1 var(--sottile); letter-spacing: .02em; color: #fff;
    text-shadow: 0 0 18px rgba(150, 240, 255, .55); }
  #report .bars { flex: 1; min-height: 0; display: flex; align-items: flex-end; gap: 7%; padding: 14px 6px 0;
    border-bottom: 1px solid var(--ciano-tenue);
    background: repeating-linear-gradient(0deg, rgba(62, 230, 255, .1) 0 1px, transparent 1px 25%); }
  #report .bars i { position: relative; flex: 1; background: linear-gradient(rgba(182, 248, 255, .95), rgba(62, 230, 255, .55)); box-shadow: 0 0 8px rgba(62, 230, 255, .45); }
  #report .bars b { position: absolute; left: 50%; bottom: 100%; transform: translate(-50%, -3px); font: 400 8px/1 var(--mono);
    color: var(--testo-2); white-space: nowrap; }
  #report .labels { flex: none; display: flex; gap: 7%; padding: 4px 6px 0; font: 400 7.5px/1.2 var(--mono); letter-spacing: .08em; color: var(--testo-2); }
  #report .labels span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: center; }
  #report .frame { position: relative; flex: 1; min-height: 0; margin: 6px -4px 0; overflow: hidden; background: #000;
    outline: 1px solid rgba(62, 230, 255, .18); }
  #report .frame img, #report .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  #report .frame.broken img { display: none; }
  #report iframe { opacity: 0; transition: opacity .6s ease; }
  #report iframe.on { opacity: 1; }
  #report .spin { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px; border-radius: 50%;
    border: 1.5px solid var(--ciano-vivo); animation: rp-spin 1.4s ease-in-out infinite; }
  @keyframes rp-spin { 50% { opacity: .3; transform: scale(.8); } }
  #report .dots { display: flex; gap: 4px; align-items: center; }
  #report .dots i { width: 4px; height: 4px; background: var(--ciano-tenue); }
  #report .dots i.on { width: 16px; background: var(--ciano); box-shadow: 0 0 6px var(--ciano); }

  /* Ologramma: etichette, scheda, legenda e cursore li fa scena.js qui dentro, col suo stile. #holo fa da contesto di
     impilamento: lo z-index di scena.js resta qui, e scritte, avvisi e report, che vengono dopo, restano sopra */
  #holo { position: fixed; inset: 0; pointer-events: none; }
  body.olo #gl { cursor: grab; }
  body.olo #gl:active { cursor: grabbing; }
  #holo .holo-card::before { content: ""; position: absolute; inset: -1px; pointer-events: none; /* angoli a staffa, come il browser */
    background: linear-gradient(var(--neon) 0 0) left top / 14px 2px, linear-gradient(var(--neon) 0 0) left top / 2px 14px,
      linear-gradient(var(--neon) 0 0) right top / 14px 2px, linear-gradient(var(--neon) 0 0) right top / 2px 14px,
      linear-gradient(var(--neon) 0 0) left bottom / 14px 2px, linear-gradient(var(--neon) 0 0) left bottom / 2px 14px,
      linear-gradient(var(--neon) 0 0) right bottom / 14px 2px, linear-gradient(var(--neon) 0 0) right bottom / 2px 14px;
    background-repeat: no-repeat; filter: drop-shadow(0 0 4px var(--neon)); }
  /* Le dita viste dalla fotocamera: punto pieno l'indice, anello il pollice. Il cursore dei gesti lo spegne scena.js.
     Lo z-index vale solo dentro #holo: le dita restano sopra scheda e legenda di scena.js (z-index 4), non sopra il resto */
  #dita { position: absolute; inset: 0; z-index: 5; }
  #dita i { position: absolute; left: 0; top: 0; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--ciano-vivo);
    box-shadow: 0 0 8px rgba(62, 230, 255, .9); opacity: 0; transition: opacity .2s; will-change: transform; }
  #dita i.pollice { background: none; border: 1.5px solid var(--ciano-vivo); }
  #dita i.on { opacity: .85; }
  #dita.riposo i.on { opacity: .35; } /* a riposo le mani si vedono ma non comandano: gesti.js aspetta un palmo aperto */

  /* Avvisi: ciano le notizie, arancione e rosso solo le anomalie */
  #warn { position: fixed; left: 50%; top: 6.5vh; transform: translateX(-50%); display: none; padding: 7px 14px; font: 400 10px/1 var(--mono);
    letter-spacing: .22em; color: var(--ciano); text-shadow: var(--bagliore); text-transform: uppercase; white-space: nowrap;
    background: linear-gradient(90deg, transparent, rgba(62, 230, 255, .08), transparent); }
  #warn.attenzione { color: var(--arancio); text-shadow: 0 0 8px rgba(255, 155, 51, .7); background: linear-gradient(90deg, transparent, rgba(255, 155, 51, .1), transparent); }
  #warn.critico { color: var(--rosso); text-shadow: 0 0 8px rgba(255, 67, 67, .7); background: linear-gradient(90deg, transparent, rgba(255, 67, 67, .1), transparent); }
</style>
<script type="importmap">
{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
</script>
</head>
<body data-mode="idle">
  <canvas id="gl"></canvas>
  <div id="holo"><div id="dita"><i class="pollice"></i><i></i><i class="pollice"></i><i></i></div></div>

  <svg id="fili" aria-hidden="true"></svg>
  <div id="status"></div>
  <div id="small"></div>
  <div id="anomalia"></div>
  <div class="dato destra" id="d-voce"><b>VOICE</b><span></span></div>
  <div class="dato destra" id="d-latenza"><b>RESPONSE</b><span></span></div>
  <div class="dato sinistra" id="d-ascolto"><b>AUDIO INPUT</b><span></span></div>
  <div class="dato sinistra" id="d-sistemi"><b>SYSTEMS</b><span></span></div>
  <div class="dato sinistra" id="d-grafica"><b>RENDER</b><span></span></div>

  <div class="bordo" id="cima"><span><b>STEM</b> // NEURAL CORE</span><span id="cima-ora"></span><span id="cima-dati"></span></div>
  <div class="bordo" id="colonna-sx"><pre id="esa"></pre></div>
  <div class="bordo" id="colonna-dx"><pre id="eventi"></pre></div>
  <div class="bordo" id="fondo"><span id="fondo-sx"></span><span class="linea"></span><span id="fondo-dx"></span></div>

  <section id="ascolto" class="staffe">
    <header><span>VOICE INPUT // IT-IT</span><span id="esito"></span></header>
    <p id="frase"><span id="frase-fissa"></span><span id="frase-viva"></span><i id="cursore"></i></p>
    <div id="livello"></div>
  </section>

  <div id="media">
    <div class="frame staffe"><img id="media-img" alt=""></div>
    <div class="title" id="media-title"></div>
  </div>

  <div id="screen">
    <div class="head"><span class="live"></span><span id="p-what">BROWSER</span><span id="p-host"></span></div>
    <div class="frame staffe">
      <img src="/api/screen" alt="">
      <div class="scan"></div>
    </div>
  </div>

  <div id="warn"></div>

  <script type="module" src="/stem.js"></script>
</body>
</html>
